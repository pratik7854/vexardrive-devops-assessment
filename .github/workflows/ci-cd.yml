name: CI/CD

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read
  id-token: write
  security-events: write

env:
  NODE_VERSION: "22"

jobs:
  test-and-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci
      - run: npm test --if-present

      - name: Dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Filesystem security scan
        uses: aquasecurity/trivy-action@0.30.0
        with:
          scan-type: fs
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true

  publish:
    needs: test-and-scan
    if: github.event_name == 'push' && vars.AZURE_CLIENT_ID != '' && vars.ACR_NAME != ''
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to Azure Container Registry
        run: az acr login --name "${{ vars.ACR_NAME }}"

      - id: meta
        run: echo "image=${{ vars.ACR_NAME }}.azurecr.io/fleet-ping:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - run: docker build --pull --tag "${{ steps.meta.outputs.image }}" .

      - name: Image security scan
        uses: aquasecurity/trivy-action@0.30.0
        with:
          image-ref: ${{ steps.meta.outputs.image }}
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true

      - run: docker push "${{ steps.meta.outputs.image }}"

  deploy:
    needs: publish
    if: needs.publish.result == 'success'
    runs-on: ubuntu-latest
    environment: ${{ startsWith(github.ref, 'refs/tags/v') && 'production' || 'development' }}
    steps:
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy revision
        run: >-
          az containerapp update
          --name "${{ vars.CONTAINER_APP_NAME }}"
          --resource-group "${{ vars.RESOURCE_GROUP }}"
          --image "${{ needs.publish.outputs.image }}"
          --revision-suffix "${GITHUB_SHA::7}"

      - name: Verify deployment
        run: curl --fail --retry 6 --retry-all-errors --max-time 10 "${{ vars.SERVICE_URL }}/readyz"
